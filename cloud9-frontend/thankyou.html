<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success - Cloud 9 Pastries</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f7f3e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .success-message {
      text-align: center;
      background: #fff;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    .success-icon {
      font-size: 80px;
      color: #4caf50;
      margin-bottom: 20px;
    }
    .success-title {
      font-size: 32px;
      color: #5c3e2d;
      margin-bottom: 15px;
    }
    .success-text {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #e4b4b4;
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 500;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #d48c8c;
    }
  </style>
</head>
<body>
  <div class="success-message">
    <div class="success-icon"><i class="fas fa-check-circle"></i></div>
    <h2 class="success-title">Order Confirmed!</h2>
    <p class="success-text">Thank you for your order. You will receive a confirmation email shortly.</p>
    <a href="index.html" class="btn">Continue Shopping</a>
  </div>
</body>
</html>
